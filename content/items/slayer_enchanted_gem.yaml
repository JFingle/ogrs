# Grizzled Traveler's voice report your current task, the count remaining,
# and your Slayer level — without trekking back to the master between
# kills. Bought from the Slayer master for slayer points (TBD); also
# given on first task as a starter convenience.
#
# Untradeable so the gem stays personal to the player who earned it.
# Sprite reuses upstream items:160 (uncut sapphire) with a dark amethyst
# tint to read as "enchanted". A dedicated faceted-gem sprite is a
# nice-to-have future sprite-hunt task.

