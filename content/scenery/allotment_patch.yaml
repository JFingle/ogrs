# OGRS scenery: Allotment Patch (empty / weedy state).
#
# Empty state shows the patch overgrown — a small fern stands in for
# "weeds you have to rake out" until a custom 3D weed-on-dirt model
# lands. type 0 keeps it laid flat-ground style instead of acting like
# a wall (fix from the first pass — type 1 made the patch render as a
# vertical fence-shaped sprite).
#
# Lifecycle: this state → Rake → swap to allotment_growing (1299) →
# allotment_ready (1300) → Harvest swaps back here (weeds regrow).

id: 1296
name: Weedy Allotment
description: An overgrown row, choked with weeds and stray grass. Time to break it.
command1: "Rake"
command2: "Examine"
type: 0                # 0 = flat ground decoration (lays on the tile)
width: 1
height: 1
ground_item_var: 0
model: smallfern       # small leafy plant — reads as "weeds growing on bare earth"
