# OGRS scenery: Goblin Iron Vein.
# Mineable rock outcrop in the goblin camp. The goblins picked the easy
# iron and left these veins half-worked — the player can finish the job.
#
# Mining handled by OgrsGoblinVein OpLoc plugin, NOT by upstream's
# ObjectMining.xml lookup (we don't extend that map at runtime). Custom
# logic: pickaxe required + Mining lvl 15 + roll, gives Iron Ore +
# 35 Mining XP, swaps to Depleted Vein (1312) for ~10s respawn.

