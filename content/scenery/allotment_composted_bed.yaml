# OGRS scenery: Allotment Bed (composted).
#
# Set when the player uses Compost on an Empty Allotment Bed (1301).
# Visually distinct from the empty bed (uses dugupsoil2 instead of
# dugupsoil1 — different mound shading) so the player has a feedback
# signal that "yes, the compost landed."
#
