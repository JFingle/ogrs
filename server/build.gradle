plugins {
    id "application"
    id "java"
}

group "org.openrsc"
version "1.0-SNAPSHOT"

application {
    mainClassName = "com.openrsc.server.Server"
    // OGRS default world. Override at the command line with `-Pconf=<name>`,
    // e.g. `./gradlew run -Pconf=preservation` to boot upstream's preservation
    // world for behavioural comparison.
    applicationDefaultJvmArgs = ['-DcoloredLogging=true','-Dconf=ogrs']
}

repositories {
    mavenCentral()
    // repo.spring.io/libs-release was decommissioned in 2024.
    // All deps that were here are on Maven Central now.
}

sourceSets {
    main {
        java {
            srcDirs "src"
            srcDirs "plugins"
        }
    }
}

dependencies {
    // Only available on jcenter which is due to be shutdown, reference locally
    implementation files("lib/JDA-4.0.0_55-withDependencies.jar")

    // Discord
    implementation "com.vdurmont:emoji-java:4.0.0"
    implementation "org.gitlab4j:gitlab4j-api:4.12.17"

    // Others
    // mysql-connector-j moved from `mysql` to `com.mysql` groupId in v8.x.
    implementation group: 'com.mysql', name: 'mysql-connector-j', version: '9.4.0'
//    implementation "org.mariadb.jdbc:mariadb-java-client:2.1.2"
    implementation "org.xerial:sqlite-jdbc:3.34.0"

    implementation "com.thoughtworks.xstream:xstream:1.4.9"
    implementation "com.lmax:disruptor:3.3.11"

    implementation "org.apache.commons:commons-collections4:4.0"
    implementation "org.apache.commons:commons-lang3:3.12.0"
    implementation "org.apache.commons:commons-compress:1.18"
    implementation "commons-lang:commons-lang:2.6"

    implementation("org.apache.logging.log4j:log4j-api:2.17.0")
    implementation("org.apache.logging.log4j:log4j-core:2.17.0")
    implementation("org.apache.logging.log4j:log4j-iostreams:2.17.0")
    implementation("org.apache.logging.log4j:log4j-slf4j-impl:2.17.0")

    implementation("org.json:json:20190722")
    // OGRS content pipeline — YAML files in content/ for NPCs, items, slayer tasks, etc.
    implementation("org.yaml:snakeyaml:2.2")
    implementation("commons-codec:commons-codec:1.14")
    implementation("xpp3:xpp3:1.1.4c")
    implementation("com.google.guava:guava:30.1.1-jre")
    implementation("com.google.inject:guice:5.0.1")
    implementation("io.netty:netty-all:4.1.107.Final")

    testImplementation "org.junit.jupiter:junit-jupiter-api:5.6.0"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine"
}

// Gradle 7+ provides its own `clean` via the java plugin; rename the
// imported Ant `clean` to avoid the duplicate-task error. All other
// Ant target names pass through untouched (compile_plugins, etc.).
ant.importBuild('build.xml') { antTargetName ->
    antTargetName == 'clean' ? 'ant_clean' : antTargetName
}

run {
    dependsOn compile_plugins
    // Forward `-Pconf=<name>` from Gradle into the JVM as `-Dconf=<name>`.
    // Without this, applicationDefaultJvmArgs wins and the command-line flag
    // is silently ignored (Gradle 7 default behaviour).
    if (project.hasProperty('conf')) {
        systemProperty 'conf', project.property('conf')
    }
}

test {
    useJUnitPlatform()
}
